# Render Blueprint: one free web service built from ./Dockerfile.
# Create it in Render with "New > Blueprint" and pick this repository.
# Full guide: DEPLOYMENT.md. Spec: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: yt-rag
    runtime: docker
    plan: free                      # must be explicit: omitting it selects a paid plan
    region: singapore               # can't be changed after the service is created
    branch: main
    dockerfilePath: ./Dockerfile    # the image listens on $PORT (Render sets it)
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass   # deploy a commit only after its GitHub CI checks pass
    envVars:
      # --- Non-secret settings: Google Gemini free tier via its OpenAI-compatible API
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: OPENAI_CHAT_MODEL
        value: gemini-3.5-flash
      - key: OPENAI_EMBED_MODEL
        value: gemini-embedding-2
      - key: EMBEDDING_DIMENSIONS     # must match VECTOR(1536) in sql/init_supabase.sql
        value: "1536"
      - key: EMBEDDING_BATCH_SIZE
        value: "100"
      - key: EMBEDDING_SEND_DIMENSIONS
        value: "true"
      - key: ENVIRONMENT
        value: production

      # --- Secrets: Render asks for these once, when the Blueprint is first created.
      # Change them later in the service's Environment tab.
      - key: OPENAI_API_KEY           # your Gemini API key from Google AI Studio
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # --- Admin token, generated by Render. Copy it from the Environment tab to
      # sign in at /admin/login, or for chatbot.py and curl (POST /seed).
      - key: SEED_TOKEN
        generateValue: true
