<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Admin sign in</title>
    <link rel="stylesheet" href="/static/theme.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .top-bar-nav a:not([class*="button"]) {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* Centered; margin: auto keeps the card reachable on short screens. */
        .sign-in-page {
            flex: 1;
            display: flex;
            padding: var(--space-6) var(--gutter);
        }

        .sign-in-card {
            width: 100%;
            max-width: 420px;
            margin: auto;
            padding: var(--space-6) var(--space-5);
            border-top: 4px solid var(--accent);
        }

        .sign-in-card h1 {
            margin-bottom: var(--space-2);
            font-size: 1.5rem;
            letter-spacing: -0.01em;
        }

        .intro {
            margin-bottom: var(--space-5);
            color: var(--text-muted);
            font-size: var(--text-sm);
            line-height: 1.5;
        }

        .sign-in-form {
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }

        .sign-in-form .field-label {
            margin-bottom: 0;
        }

        .sign-in-form .button-primary {
            width: 100%;
            margin-top: var(--space-1);
            font-size: var(--text-base);
        }

        .form-message {
            min-height: 1.5em;
            font-size: var(--text-sm);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <div class="top-bar-inner">
            <span class="wordmark">Meet Kai</span>
            <span class="badge">Admin</span>
            <nav class="top-bar-nav" aria-label="Admin">
                <a href="/chat">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
                    Back to chat
                </a>
            </nav>
        </div>
    </header>

    <main class="sign-in-page">
        <div class="card sign-in-card">
            <h1>Admin sign in</h1>
            <p class="intro" id="intro">Enter this deployment's admin token (SEED_TOKEN) to manage the knowledge base.</p>
            <form class="sign-in-form" id="signInForm" novalidate>
                <label class="field-label" for="tokenInput">Admin token</label>
                <input id="tokenInput" class="field" type="password" autocomplete="current-password" aria-describedby="intro" autofocus>
                <button type="submit" class="button-primary" id="signInBtn">Sign in</button>
                <p id="message" class="form-message text-error" role="alert"></p>
            </form>
        </div>
    </main>

    <script>
        const signInForm = document.getElementById('signInForm');
        const tokenInput = document.getElementById('tokenInput');
        const signInBtn = document.getElementById('signInBtn');
        const message = document.getElementById('message');

        // POST /admin/login answers 204 with the session cookie for the right token,
        // and 401 for any other. The token is sent once and kept nowhere in the page.
        signInForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const token = tokenInput.value.trim();
            if (!token) {
                message.textContent = 'Enter the admin token';
                tokenInput.focus();
                return;
            }

            signInBtn.disabled = true;
            message.textContent = '';
            try {
                const response = await fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });
                if (response.status === 204) {
                    location.replace('/admin');
                    return; // the button stays disabled while the editor opens
                }
                if (response.status === 401) {
                    message.textContent = 'Admin token rejected';
                    tokenInput.select();
                } else {
                    message.textContent = "Can't sign in right now. Please try again.";
                    tokenInput.focus();
                }
            } catch (error) {
                message.textContent = "Can't reach the server";
                tokenInput.focus();
            }
            signInBtn.disabled = false;
        });
    </script>
</body>
</html>
