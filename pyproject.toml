# Tool configuration only. This project is not packaged; runtime dependencies
# live in requirements.txt and development dependencies in requirements-dev.txt.

[tool.ruff]
# Matches the production image (python:3.11-slim).
target-version = "py311"
# Ruff already respects .gitignore; this is an explicit safety net.
extend-exclude = ["venv_yt_rag"]

[tool.ruff.lint]
# Explicit, so the checked rules don't change when ruff's own defaults change:
# pyflakes (F) plus the pycodestyle error groups E4, E7 and E9.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
# Only collect tests/. The root-level test_setup.py is a manual script that
# calls real OpenAI/Supabase services and must not run in CI.
testpaths = ["tests"]
# Put the repository root on sys.path so tests can import `app` and `main`.
pythonpath = ["."]
