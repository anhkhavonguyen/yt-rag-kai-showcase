# Continuous integration: lint, offline tests and a container build check.
# Needs no secrets or paid services; nothing is pushed or deployed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only token for every job.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the outdated run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Install only the ruff version pinned in requirements-dev.txt, so CI and
      # local runs use the same linter without installing runtime dependencies.
      - name: Install ruff
        run: pip install "$(grep '^ruff==' requirements-dev.txt)"

      - name: Ruff
        run: ruff check . --output-format github

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # tests/conftest.py supplies placeholder settings and blocks every
      # external service, so no credentials are needed here.
      - name: Pytest
        run: pytest

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Build only: no registry login, no push, no deploy.
      - name: Build image
        run: docker build -t yt-rag:ci .
